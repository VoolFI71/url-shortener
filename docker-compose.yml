services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_create_links.sql:/docker-entrypoint-initdb.d/001_create_links.sql:ro

  app:
    build: .
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://shortener:shortener@postgres:5432/shortener?sslmode=disable
      PUBLIC_BASE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
